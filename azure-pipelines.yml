trigger:
  branches:
    include:
      - main

variables:
  NODE_VERSION: '20.x'
  ALLURE_REPORT_DIR: 'allure-report'
  vmImage: 'ubuntu-latest'

stages:
- stage: TestExecution
  displayName: Execute WDIO Tests
  pool:
    vmImage: $(vmImage)

  jobs:
    - job: RunTests
      steps:
        - task: NodeTool@0
          displayName: Install Node.js
          inputs:
            versionSpec: $(NODE_VERSION)

        - script: npm ci
          displayName: Install Dependencies

        - script: npx wdio run wdio.conf.js
          displayName: Run WDIO Tests

        - script: npx allure generate allure-results --clean -o $(ALLURE_REPORT_DIR)
          displayName: Generate Allure Report
          condition: always()

        - task: PublishPipelineArtifact@1
          displayName: Publish Allure Report
          condition: always()
          inputs:
            targetPath: $(Build.SourcesDirectory)/$(ALLURE_REPORT_DIR)
            artifact: allure-report

- stage: SendEmailNotification
  displayName: Send Allure Report via Email
  pool:
    vmImage: $(vmImage)

  jobs:
    - job: SendEmail
      steps:
        - task: DownloadPipelineArtifact@2
          displayName: Download Allure Report
          inputs:
            artifact: allure-report
            path: $(Pipeline.Workspace)/download

        - script: |
            set -e
            ZIP_PATH="$(Build.ArtifactStagingDirectory)/allure-report.zip"
            DOWNLOAD_DIR="$(Pipeline.Workspace)/download"
            cd "$DOWNLOAD_DIR"
            
            [ -f "index.html" ] || { echo "ERROR: index.html not found"; ls -la; exit 1; }
            
            zip -r $ZIP_PATH .
            ENCODED=$(base64 "$ZIP_PATH" | tr -d '\n')
            
            cat > /tmp/email-payload.json <<EOF
            {
              "from": "onboarding@resend.dev",
              "to": "s4.islam@a1qa.com",
              "subject": "Allure Report",
              "html": "<p>Attached is the latest build Allure Report.</p>",
              "attachments": [{
                "filename": "allure-report.zip",
                "content": "$ENCODED",
                "type": "application/zip"
              }]
            }
            EOF
            
            curl -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_EMAIL_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/email-payload.json
          displayName: Create and Send Allure Report
          env:
            RESEND_EMAIL_API_KEY: $(RESEND_EMAIL_API_KEY)
