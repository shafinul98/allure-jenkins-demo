trigger:
  branches:
    include:
      - main

variables:
  NODE_VERSION: '20.x'
  ALLURE_REPORT_DIR: 'allure-report'

stages:
- stage: TestExecution
  displayName: Execute WDIO Tests

  jobs:
    - job: RunTests

      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          clean: true

        - task: NodeTool@0
          displayName: Install Node.js
          inputs:
            versionSpec: $(NODE_VERSION)

        - script: npm ci
          displayName: Install Dependencies

        - script: |
            npx wdio run wdio.conf.js
          displayName: Run WDIO Tests

        - script: |
            npx allure generate allure-results \
              --clean \
              -o $(ALLURE_REPORT_DIR)
          displayName: Generate Allure Report
          condition: always()

        - task: PublishPipelineArtifact@1
          displayName: Publish Allure Report
          condition: always()
          inputs:
            targetPath: $(Build.SourcesDirectory)/$(ALLURE_REPORT_DIR)
            artifact: allure-report

- stage: SendEmailNotification
  displayName: "Sending email to user with allure report as attachment"

  jobs:
    - job: SendEmail

      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          clean: true

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: allure-report
            path: $(Pipeline.Workspace)/download

        - script: | 
            set -e

            ZIP_PATH="$(Build.ArtifactStagingDirectory)/allure-report.zip"

            # Debug: List downloaded artifacts
            echo "Listing contents of $(Pipeline.Workspace)/download:"
            ls -la "$(Pipeline.Workspace)/download" || echo "Download directory not found"

            # Find and navigate to allure-report directory
            REPORT_DIR=$(find "$(Pipeline.Workspace)/download" -type d -name "allure-report" | head -1)
            
            if [ -z "$REPORT_DIR" ]; then
              echo "ERROR: Allure report directory not found in $(Pipeline.Workspace)/download"
              echo "Full directory tree:"
              find "$(Pipeline.Workspace)/download" -type f | head -20
              exit 1
            fi

            echo "Found report at: $REPORT_DIR"
            cd "$REPORT_DIR"
            zip -r $ZIP_PATH .

            ENCODED=$(base64 "$ZIP_PATH" | tr -d '\n')

            cat > /tmp/email-payload.json <<EOF
            {
              "from": "onboarding@resend.dev",
              "to": "s4.islam@a1qa.com",
              "subject": "Allure Report",
              "html": "<p>Attached is the latest build Allure Report.</p>",
              "attachments": [{
                "filename": "allure-report.zip",
                "content": "$ENCODED",
                "type": "application/zip"
              }]
            }
            EOF

            curl -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_EMAIL_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/email-payload.json
          displayName: "Send Allure Report via Resend"    
          env:
            RESEND_EMAIL_API_KEY: $(RESEND_EMAIL_API_KEY)
