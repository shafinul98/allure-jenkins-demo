trigger:
  branches:
    include:
      - main

variables:
  NODE_VERSION: '20.x'
  ALLURE_REPORT_DIR: 'allure-report'

stages:
- stage: TestExecution
  displayName: Execute WDIO Tests

  jobs:
    - job: RunTests

      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          clean: true

        - task: NodeTool@0
          displayName: Install Node.js
          inputs:
            versionSpec: $(NODE_VERSION)

        - script: npm ci
          displayName: Install Dependencies

        - script: |
            npx wdio run wdio.conf.js
          displayName: Run WDIO Tests

        - script: |
            npx allure generate allure-results \
              --clean \
              -o $(ALLURE_REPORT_DIR)
          displayName: Generate Allure Report
          condition: always()

        - task: PublishPipelineArtifact@1
          displayName: Publish Allure Report
          condition: always()
          inputs:
            targetPath: $(Build.SourcesDirectory)/$(ALLURE_REPORT_DIR)
            artifact: allure-report

- stage: SendEmailNotification
  displayName: "Sending email to user with allure report as attachment"

  jobs:
    - job: SendEmail

      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          clean: true

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: allure-report
            path: $(Pipeline.Workspace)/download

        - script: | 
            set -e

            ZIP_PATH="$(Build.ArtifactStagingDirectory)/allure-report.zip"
            DOWNLOAD_DIR="$(Pipeline.Workspace)/download"

            # The artifact is published as its contents, not as a directory
            # So the report files are directly in the download path
            cd "$DOWNLOAD_DIR"
            
            # Verify we have the expected allure report files
            if [ ! -f "index.html" ]; then
              echo "ERROR: index.html not found in $DOWNLOAD_DIR"
              ls -la "$DOWNLOAD_DIR"
              exit 1
            fi

            echo "Creating zip from allure report files..."
            zip -r $ZIP_PATH .

            echo "Encoding zip file for email attachment..."
            ENCODED=$(base64 "$ZIP_PATH" | tr -d '\n')

            cat > /tmp/email-payload.json <<EOF
            {
              "from": "onboarding@resend.dev",
              "to": "s4.islam@a1qa.com",
              "subject": "Allure Report",
              "html": "<p>Attached is the latest build Allure Report.</p>",
              "attachments": [{
                "filename": "allure-report.zip",
                "content": "$ENCODED",
                "type": "application/zip"
              }]
            }
            EOF

            echo "Sending email with report attachment..."
            curl -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_EMAIL_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/email-payload.json
          displayName: "Send Allure Report via Resend"    
          env:
            RESEND_EMAIL_API_KEY: $(RESEND_EMAIL_API_KEY)
